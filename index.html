<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROBLOX: Premium Hub</title>
    <style>
        /* AUTHENTIC ROBLOX DARK THEME CORE & LUXURY PINK RUNWAY */
        body { 
            margin: 0; 
            background: #111111; 
            background-image: radial-gradient(circle at center, #2c0b30 0%, #0c020d 100%);
            color: white; 
            font-family: 'Arial Black', 'Arial', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        #game-container { 
            width: 900px; 
            height: 580px; 
            background: #18181c; 
            border: 4px solid #ff4da6; 
            border-radius: 24px; 
            display: flex; 
            box-shadow: 0 0 40px rgba(255, 77, 166, 0.4); 
            position: relative; 
            overflow: hidden;
        }
        
        #main-area { 
            flex: 2.3;
            display: flex; 
            flex-direction: column; 
            border-right: 3px solid #ff4da6; 
            padding: 20px; 
            position: relative; 
            background: rgba(0, 0, 0, 0.3);
        }
        
        #sidebar { 
            width: 280px;
            display: flex; 
            flex-direction: column; 
            padding: 15px; 
            background: #0f0f12; 
        }

        /* TOP USER BAR BRANDING */
        #stats-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            background: linear-gradient(90deg, #25252b, #1a1a1f); 
            padding: 12px 20px; 
            border-radius: 16px; 
            margin-bottom: 20px; 
            border: 2px solid rgba(255, 77, 166, 0.2); 
        }
        #username-display { font-size: 14px; color: #e0e0e0; letter-spacing: 0.5px;}
        #robux-display { color: #ffca28; font-size: 16px; text-shadow: 0 0 10px rgba(255,202,40,0.5); }

        /* NAVIGATION BAR */
        .nav-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: auto; }
        
        .btn { 
            background: linear-gradient(135deg, #ff4da6 0%, #ff007f 100%); 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 30px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 13px; 
            transition: all 0.2s ease; 
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
            text-align: center;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 0, 127, 0.5); }
        .btn:active { transform: translateY(1px); }

        /* SCREENS ENGINE */
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; }
        .active { display: flex !important; }

        h2 { margin-top: 0; color: #ff4da6; text-transform: uppercase; font-size: 24px; text-align: center; text-shadow: 0 0 15px rgba(255,77,166,0.5); margin-bottom: 15px; }

        /* DISCOVERY SCREEN GAMES ROOM */
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .game-card { background: linear-gradient(145deg, #232329, #18181f); border: 3px solid #3a3a45; border-radius: 18px; text-align: center; padding: 45px 15px; cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 8px 16px rgba(0,0,0,0.4); }
        .game-card:hover { border-color: #ff4da6; transform: translateY(-5px); box-shadow: 0 12px 24px rgba(255,77,166,0.3); }
        .game-card-title { font-weight: bold; font-size: 16px; margin-top: 15px; color: #fff; letter-spacing: 0.5px; }

        /* DRESS TO IMPRESS RUNWAY VISUALS */
        #avatar-preview { 
            width: 130px; 
            height: 130px; 
            background: radial-gradient(circle, #ff85c2 0%, #ff3399 100%); 
            margin: 5px auto 10px auto; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 70px; 
            border: 5px solid #fff; 
            box-shadow: 0 0 30px rgba(255,255,255,0.5), inset 0 0 20px rgba(0,0,0,0.3);
            transition: all 0.5s ease;
        }
        .category-tabs { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; }
        .tab-btn { background: #25252e; border: 2px solid #3e3e4f; color: #b5b5c3; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 11px; font-weight: bold; transition: 0.2s; }
        .tab-btn:hover { background: #2f2f3d; color: #fff; }
        .active-tab { background: #ff4da6 !important; color: white !important; border-color: #ff85c2 !important; box-shadow: 0 0 12px rgba(255,77,166,0.6); }
        
        .category-panel { display: none; grid-template-columns: repeat(4, 1fr); gap: 12px; justify-items: center; padding: 5px; max-height: 160px; overflow-y: auto; }
        .active-panel { display: grid !important; }
        
        .item-btn { 
            width: 65px; 
            height: 65px; 
            background: radial-gradient(circle, #4a124a 0%, #1e0521 100%); 
            border: 3px solid #ff4da6; 
            color: white; 
            border-radius: 50%; 
            cursor: pointer; 
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: 0.2s;
        }
        .item-btn:hover { transform: scale(1.15) rotate(8deg); border-color: #fff; box-shadow: 0 0 15px #ff4da6; }
        .vip-item { background: radial-gradient(circle, #ffe066 0%, #f5b041 100%) !important; border-color: #fff !important; box-shadow: 0 0 12px #f5b041 !important; }

        /* BRAINROT TYCOON GENERATOR UI */
        #clicker-btn { 
            width: 130px; 
            height: 130px; 
            background: radial-gradient(circle, #ff6e40 0%, #dd2c00 100%); 
            border: 4px solid #ff9e80; 
            border-radius: 50%; 
            font-size: 55px; 
            cursor: pointer; 
            box-shadow: 0 10px 0 #9e1c00, 0 15px 25px rgba(0,0,0,0.6); 
            transition: transform 0.05s; 
            margin: 15px auto; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        #clicker-btn:active { transform: translateY(8px); box-shadow: 0 2px 0 #9e1c00, 0 5px 10px rgba(0,0,0,0.6); }
        .upgrade-shop { background: #22222a; padding: 12px; border-radius: 16px; border: 2px solid #dd2c00; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
        .shop-btn { background: #33333f; color: #fff; text-align: left; padding: 10px 15px; border-radius: 12px; font-size: 11px; border: 1px solid #444; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .shop-btn:hover:not(:disabled) { background: #dd2c00; border-color: #ff9e80; }
        .shop-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ROBLOX SIDE CHAT BOX ENGINE */
        #chat-box { flex: 1; background: rgba(0, 0, 0, 0.5); border-radius: 12px; padding: 12px; overflow-y: auto; margin-bottom: 12px; font-size: 13px; font-family: 'Arial', sans-serif; border: 2px solid rgba(255, 77, 166, 0.1); }
        .chat-msg { margin-bottom: 8px; line-height: 1.4; word-break: break-word; }
        .chat-system { color: #ff85c2; font-style: italic; font-weight: bold; }
        .chat-input-container { display: flex; gap: 8px; }
        #chat-input { flex: 1; background: #1c1c24; border: 2px solid #3a3a45; padding: 12px 16px; color: white; border-radius: 25px; outline: none; font-size: 13px; }
        #chat-input:focus { border-color: #ff4da6; }
    </style>
</head>
<body onload="startEverything()">

    <div id="game-container">
        <!-- Main Game Interactive Window -->
        <div id="main-area">
            <div id="stats-bar">
                <div id="username-display">👤 PLAYER_ HUB</div>
                <div id="robux-display">💰 <span id="robux-count">15,000</span> ROBUX</div>
            </div>

            <!-- DISCOVERY MENU -->
            <div id="screen-games" class="screen active">
                <h2>🎮 SELECT GAME MODE 🎮</h2>
                <div class="game-grid">
                    <div class="game-card" onclick="goToScreen('dress')">
                        <div style="font-size: 55px;">👗</div>
                        <div class="game-card-title">Dress to Impress</div>
                    </div>
                    <div class="game-card" onclick="goToScreen('brainrot')">
                        <div style="font-size: 55px;">🧠</div>
                        <div class="game-card-title">Steal a Brainrot Tycoon</div>
                    </div>
                </div>
            </div>

            <!-- DRESS TO IMPRESS GAME MODULE -->
            <div id="screen-game-dress" class="screen">
                <h2>👑 DRESS TO IMPRESS 👑</h2>
                <div id="dress-theme-display" style="text-align:center; font-weight:bold; color:#ff85c2; font-size:14px; margin-bottom:12px;">LOADING MAIN RUNWAY THEME...</div>
                
                <div id="avatar-preview">🎀</div>
                
                <div class="category-tabs">
                    <button class="tab-btn active-tab" onclick="switchCategory('dresses', event)">👗 Clothes</button>
                    <button class="tab-btn" onclick="switchCategory('shoes', event)">👜 Shoes/Bags</button>
                    <button class="tab-btn" onclick="switchCategory('hair', event)">💄 Makeup</button>
